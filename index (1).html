<title>Village Tracker</title>
<style>
:root{--bg:#10192b;--card:#1b2a45;--card2:#223458;--text:#f1f5ff;--muted:#97a7c7;--gold:#ffc83d;--green:#7ed957;--red:#ff6b6b;--line:#2d4166;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef3fb;--card:#fff;--card2:#e4ecfa;--text:#14243d;--muted:#5b6b88;--gold:#b97800;--green:#2e8b2e;--red:#c62828;--line:#cfd9ec;color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3fb;--card:#fff;--card2:#e4ecfa;--text:#14243d;--muted:#5b6b88;--gold:#b97800;--green:#2e8b2e;--red:#c62828;--line:#cfd9ec;color-scheme:light}}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif;padding:14px;max-width:600px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:46px;height:46px;border-radius:12px;background:#1e3a66;display:grid;place-items:center;flex:none}
h1{font-size:1.2rem;margin:0}.sub{font-size:.78rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:.95rem;margin:0 0 10px;color:var(--gold)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:linear-gradient(#9be15d,#5fb82e);color:#10260a;box-shadow:0 2px 0 #3c7d1a}
button.alt{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
textarea{width:100%;box-sizing:border-box;height:90px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px;font-size:.8rem;margin:8px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.15rem}.stat span{font-size:.72rem;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.n{font-weight:600}.m{font-size:.75rem;color:var(--muted)}
.t{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);text-align:right;white-space:nowrap}
.t.d{color:var(--green)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.msg{color:var(--muted);font-size:.85rem;text-align:center;padding:10px}
.err{color:var(--red)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tab{flex:none;background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none;padding:8px 12px;font-size:.85rem}
.tab.on{background:linear-gradient(#ffd54a,#e08a00);color:#14243d;border-color:transparent}
.tab small{opacity:.8}
#nm{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
ol{padding-left:18px;margin:8px 0 0;font-size:.85rem;color:var(--muted);line-height:1.6}
</style>
<style>
:root{--r:18px;--glow:0 0 18px rgba(255,200,61,.35)}
body{font-family:"Inter","Segoe UI",Roboto,system-ui,"Noto Sans Bengali",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;background:radial-gradient(120% 60% at 50% -10%,#24427a 0,var(--bg) 60%) fixed,var(--bg);padding-bottom:40px}
h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#ffe08a,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.74rem;letter-spacing:.04em}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#2a4f8f,#14243d);box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.card{border-radius:var(--r);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--card);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.28)}
h2{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
button{border-radius:999px;font-weight:800;letter-spacing:.01em;transition:transform .12s,filter .12s}
button:active{transform:scale(.96);filter:brightness(1.1)}
.tab{border-radius:999px;font-weight:700}.tab.on{box-shadow:var(--glow)}
.stat{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px 6px}
.stat b{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem;font-weight:600;letter-spacing:.04em}
.n{font-size:.98rem;font-weight:700;letter-spacing:-.005em}.m{font-size:.74rem}
.t{font-size:1.02rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;text-shadow:0 0 14px rgba(255,200,61,.3)}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08)}
.bar i{border-radius:99px;background:linear-gradient(90deg,#ffb300,#ffe08a);box-shadow:0 0 10px rgba(255,200,61,.5);transition:width .6s}
.row{border-top:1px solid rgba(255,255,255,.07)}
textarea,#nm{border-radius:12px}
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="32" height="32" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54a"/><stop offset="1" stop-color="#e08a00"/></linearGradient></defs><path d="M50 10l34 11v27c0 22-15 36-34 44-19-8-34-22-34-44V21z" fill="url(#g)" stroke="#14243d" stroke-width="4"/><path d="M36 40h28M50 40v28" stroke="#14243d" stroke-width="9" stroke-linecap="round"/></svg></div>
  <div><h1>Village Tracker</h1><div class="sub" id="upd">ডেটা এখনো নেই</div></div>
</header>

<div class="tabs" id="tabs"></div>
<div class="card" id="nmc" style="padding:8px"><input id="nm" maxlength="14" placeholder="অ্যাকাউন্টের নাম"></div>
<div class="card">
  <div class="btns">
    <button id="paste">📋 ক্লিপবোর্ড থেকে ইমপোর্ট</button>
    <button class="alt" id="manual">✍️ হাতে পেস্ট</button><button class="alt" id="clr">🗑️ ক্লিয়ার</button>
  </div>
  <div id="box" hidden><textarea id="ta" placeholder="এখানে JSON পেস্ট করুন"></textarea><button id="load">লোড করুন</button></div>
  <div id="err" class="msg err" hidden></div>
  <details style="margin-top:8px"><summary>কীভাবে ডেটা আনবেন?</summary>
    <ol><li>CoC খুলুন → Settings → Data Export</li><li>Export Village data in JSON format এর পাশে <b>Copy</b> চাপুন</li><li>এখানে এসে ইমপোর্ট বাটন চাপুন</li></ol>
  </details>
</div>

<div id="app"></div>

<script>
var CAT={buildings:"বিল্ডিং",heroes:"হিরো",units:"ল্যাব: ট্রুপ",siege_machines:"ল্যাব: সিজ",spells:"ল্যাব: স্পেল",pets:"পেট",equipment:"ইকুইপমেন্ট",traps:"ট্র্যাপ",buildings2:"বিল্ডার বেস",heroes2:"বিল্ডার হিরো",units2:"বিল্ডার ট্রুপ"};
var NAMES={1000001:"Town Hall",28000000:"Barbarian King",28000001:"Archer Queen",28000002:"Grand Warden",28000004:"Royal Champion",28000006:"Minion Prince",4000000:"Barbarian",4000001:"Archer",4000002:"Goblin",4000003:"Giant",4000004:"Wall Breaker",4000005:"Balloon",4000006:"Wizard",4000007:"Healer",4000008:"Dragon",4000009:"P.E.K.K.A",4000010:"Minion",4000011:"Hog Rider",4000012:"Valkyrie",4000013:"Golem",4000015:"Witch",4000017:"Lava Hound",4000022:"Bowler",4000023:"Baby Dragon",4000024:"Miner",4000031:"Electro Dragon",26000000:"Lightning Spell",26000001:"Healing Spell",26000002:"Rage Spell",26000003:"Jump Spell",26000005:"Freeze Spell",26000009:"Poison Spell",26000010:"Earthquake Spell",26000011:"Haste Spell",26000016:"Clone Spell",26000017:"Skeleton Spell",26000028:"Bat Spell"};
var HEROES={28000000:1,28000001:1,28000002:1,28000004:1,28000006:1};
var D=null,S={accs:[],cur:0},sig="",arm=0;
for(var q=0;q<6;q++)S.accs.push({name:"অ্যাকাউন্ট "+(q+1),data:null});
function save(){try{localStorage.setItem("coc-multi",JSON.stringify(S))}catch(e){}}
function tabs(){
  var s=S.cur+"|"+S.accs.map(function(a){return a.name+(a.data?a.data.th:"")}).join("|");
  $("nmc").hidden=S.cur<0;
  if(s===sig)return;sig=s;
  var h='<button class="tab '+(S.cur<0?'on':'')+'" data-i="-1">📊 সব</button>';
  S.accs.forEach(function(a,i){h+='<button class="tab '+(S.cur===i?'on':'')+'" data-i="'+i+'">'+esc(a.name)+(a.data&&a.data.th?' <small>TH'+a.data.th+'</small>':'')+'</button>'});
  $("tabs").innerHTML=h;
  if(S.cur>=0&&document.activeElement!==$("nm"))$("nm").value=S.accs[S.cur].name;
}
function overview(){
  var now=Date.now();$("upd").textContent="৬টি অ্যাকাউন্টের সারসংক্ষেপ";
  var h='<div class="card"><h2>📊 সব অ্যাকাউন্ট</h2>';
  S.accs.forEach(function(a,i){
    var d=a.data,info='<span class="m">ডেটা নেই</span>',t='';
    if(d){var act=d.ups.filter(function(u){return u.end>now}).sort(function(x,y){return x.end-y.end}),dn=d.ups.length-act.length;
      info='<span class="m">TH'+(d.th||"?")+' • চলমান '+act.length+(dn?' • শেষ '+dn:'')+'</span>';
      if(act.length)t='<div class="m">'+esc(act[0].name)+'</div>'+fmt(act[0].end-now);else if(dn)t='সব শেষ ✅'}
    h+='<div class="row" data-i="'+i+'" style="cursor:pointer"><div><div class="n">'+esc(a.name)+'</div>'+info+'</div><div class="t">'+t+'</div></div>'
  });
  $("app").innerHTML=h+'</div>';
}
function pick(e){var el=e.target.closest("[data-i]");if(!el)return;S.cur=+el.getAttribute("data-i");save();sig="";arm=0;$("clr").textContent="🗑️ ক্লিয়ার";render()}
$("tabs").onclick=pick;$("app").onclick=pick;
$("clr").onclick=function(){if(S.cur<0)return;if(!arm){arm=1;$("clr").textContent="⚠️ আবার চাপুন";return}arm=0;$("clr").textContent="🗑️ ক্লিয়ার";S.accs[S.cur].data=null;save();sig="";render()};
$("nm").oninput=function(){if(S.cur<0)return;S.accs[S.cur].name=this.value||("অ্যাকাউন্ট "+(S.cur+1));save();render()};
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function parse(txt){
  var j=JSON.parse(txt),ts=(j.timestamp||Math.floor(Date.now()/1000)),ups=[],heroes=[],th=0,counts={};
  Object.keys(j).forEach(function(k){
    var a=j[k];if(!Array.isArray(a))return;
    a.forEach(function(it){
      if(!it||typeof it!=="object"||it.data==null)return;
      var nm=NAMES[it.data]||("আইটেম #"+it.data);
      counts[k]=(counts[k]||0)+(it.cnt||1);
      if(it.data===1000001)th=it.lvl;
      if(HEROES[it.data])heroes.push({name:nm,lvl:it.lvl,timer:it.timer||0});
      if(it.timer>0)ups.push({name:nm,cat:CAT[k]||k,lvl:it.lvl,total:it.timer,end:(ts+it.timer)*1000,key:k});
    });
  });
  return {tag:j.tag||"",th:th,saved:Date.now(),ts:ts*1000,ups:ups,heroes:heroes,counts:counts};
}
function fmt(ms){if(ms<=0)return "শেষ ✅";var s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;return (d?d+"দিন ":"")+((h||d)?h+"ঘ ":"")+m+"মি"+(d?"":" "+c+"সে")}
function render(){
  tabs();
  if(S.cur<0){overview();return}
  D=S.accs[S.cur].data;
  if(!D){$("upd").textContent="এই অ্যাকাউন্টে ডেটা নেই";$("app").innerHTML='<div class="msg">উপরে ইমপোর্ট করলে এই অ্যাকাউন্টের তথ্য এখানে দেখাবে।</div>';return}
  var now=Date.now(),ups=D.ups.slice().sort(function(a,b){return a.end-b.end});
  var active=ups.filter(function(u){return u.end>now}),done=ups.length-active.length;
  var builders=active.filter(function(u){return u.key==="buildings"||u.key==="heroes"}).length;
  $("upd").textContent="স্ন্যাপশট: "+new Date(D.ts).toLocaleString("bn-BD",{dateStyle:"medium",timeStyle:"short"})+(D.tag?" • "+D.tag:"");
  var h='<div class="card"><div class="grid"><div class="stat"><b>'+(D.th||"?")+'</b><span>টাউন হল</span></div><div class="stat"><b>'+active.length+'</b><span>চলমান আপগ্রেড</span></div><div class="stat"><b>'+done+'</b><span>শেষ (কালেক্ট বাকি)</span></div></div></div>';
  h+='<div class="card"><h2>⏳ আপগ্রেড টাইমার</h2>';
  if(!ups.length)h+='<div class="msg">কোনো আপগ্রেড চলছে না</div>';
  ups.forEach(function(u){
    var left=u.end-now,pct=Math.min(100,Math.max(0,100-left/(u.total*1000)*100));
    h+='<div class="row"><div style="flex:1"><div class="n">'+esc(u.name)+' <span class="m">→ লেভেল '+(u.lvl+1)+'</span></div><div class="m">'+esc(u.cat)+' • শেষ: '+new Date(u.end).toLocaleString("bn-BD",{dateStyle:"short",timeStyle:"short"})+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div><div class="t '+(left<=0?'d':'')+'">'+fmt(left)+'</div></div>'
  });
  h+='</div>';
  if(D.heroes.length){
    h+='<div class="card"><h2>🦸 হিরো</h2>';
    D.heroes.forEach(function(x){var u=x.timer>0;h+='<div class="row"><div class="n">'+esc(x.name)+'</div><div class="t">লেভেল '+x.lvl+(u?' ⬆️':'')+'</div></div>'});
    h+='</div>';
  }
  var ck=Object.keys(D.counts);
  if(ck.length){h+='<div class="card"><h2>📦 সারসংক্ষেপ</h2><div class="grid">'+ck.map(function(k){return '<div class="stat"><b>'+D.counts[k]+'</b><span>'+esc(CAT[k]||k)+'</span></div>'}).join("")+'</div></div>'}
  $("app").innerHTML=h;
}
function go(txt){
  var e=$("err");e.hidden=true;
  try{var nd=parse(txt.trim()),f=-1,i,k;
    if(nd.tag)for(i=0;i<6;i++){var x0=S.accs[i].data;if(x0&&x0.tag===nd.tag){f=i;break}}
    if(f<0){var c=S.cur>=0?S.accs[S.cur].data:null;if(S.cur>=0&&(!c||!c.tag))f=S.cur;else for(k=0;k<6;k++)if(!S.accs[k].data){f=k;break}}
    if(f<0)f=S.cur>=0?S.cur:0;
    S.cur=f;S.accs[f].data=nd;save();sig="";$("box").hidden=true;render()}
  catch(x){e.textContent="JSON পড়া যায়নি। আবার Copy করে চেষ্টা করুন।";e.hidden=false}
}
$("paste").onclick=function(){
  if(window.AndroidClip){go(window.AndroidClip.get())}else if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(go).catch(function(){$("box").hidden=false;$("err").textContent="ক্লিপবোর্ড অনুমতি নেই, নিচে পেস্ট করুন।";$("err").hidden=false})}
  else{$("box").hidden=false}
};
$("manual").onclick=function(){$("box").hidden=!$("box").hidden};
$("load").onclick=function(){go($("ta").value)};
try{var s=localStorage.getItem("coc-multi");if(s){var o=JSON.parse(s);if(o&&o.accs&&o.accs.length===6)S=o}else{var old=localStorage.getItem("coc-village");if(old)S.accs[0].data=JSON.parse(old)}}catch(e){}
render();setInterval(render,1000);
</script>
</body>
</html>
