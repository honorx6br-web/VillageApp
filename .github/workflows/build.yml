name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/village/tracker
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/layout app/src/main/res/xml
          src=$(ls village*.html | head -n 1)
          cp "$src" app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "VillageTracker"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.village.tracker'
            compileSdk 34
            defaultConfig {
              applicationId 'com.village.tracker'
              minSdk 26
              targetSdk 34
              versionCode 3
              versionName '2.1'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
            <application
              android:label="Village Tracker"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:theme="@style/AppTheme"
              android:allowBackup="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <receiver android:name=".VillageWidget" android:exported="false">
                <intent-filter>
                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                </intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
              </receiver>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:windowBackground">#000000</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#24427A" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#14243D" android:pathData="M0,54h108v54h-108z"/>
            <path android:fillColor="#1B3560" android:pathData="M0,0h108v54h-108z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A1220" android:pathData="M54,27 L80,36 L80,59 C80,73 68,83 54,89 C40,83 28,73 28,59 L28,36 Z"/>
            <path android:fillColor="#FFC83D" android:pathData="M54,24 L80,33 L80,56 C80,70 68,80 54,86 C40,80 28,70 28,56 L28,33 Z"/>
            <path android:fillColor="#F0960A" android:pathData="M54,29 L75,36 L75,55 C75,66 66,74 54,80 C42,74 33,66 33,55 L33,36 Z"/>
            <path android:strokeColor="#14243D" android:strokeWidth="7" android:strokeLineCap="round" android:pathData="M43,46 L65,46 M54,46 L54,66"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/widget_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#F01C1C1E"/>
            <corners android:radius="24dp"/>
          </shape>
          EOF

          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
            android:minWidth="250dp"
            android:minHeight="250dp"
            android:updatePeriodMillis="1800000"
            android:initialLayout="@layout/widget"
            android:resizeMode="horizontal|vertical"
            android:widgetCategory="home_screen"/>
          EOF

          {
          echo '<?xml version="1.0" encoding="utf-8"?>'
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="14dp" android:background="@drawable/widget_bg">'
          echo '<TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="BUILDER TIMERS" android:textSize="11sp" android:textColor="#8E8E93" android:textStyle="bold" android:letterSpacing="0.1" android:paddingBottom="4dp"/>'
          for i in 1 2 3 4 5 6; do
          echo '<LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:gravity="center_vertical" android:orientation="horizontal">'
          echo '<LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">'
          echo '<TextView android:id="@+id/n'$i'" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="14sp" android:textStyle="bold" android:maxLines="1"/>'
          echo '<TextView android:id="@+id/s'$i'" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#8E8E93" android:textSize="11sp" android:maxLines="1"/>'
          echo '</LinearLayout>'
          echo '<FrameLayout android:layout_width="wrap_content" android:layout_height="wrap_content">'
          echo '<Chronometer android:id="@+id/t'$i'" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FF9F0A" android:textSize="15sp" android:textStyle="bold"/>'
          echo '<TextView android:id="@+id/e'$i'" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#30D158" android:textSize="15sp" android:textStyle="bold"/>'
          echo '</FrameLayout>'
          echo '</LinearLayout>'
          done
          echo '</LinearLayout>'
          } > app/src/main/res/layout/widget.xml

          cat > app/src/main/java/com/village/tracker/VillageWidget.java <<'EOF'
          package com.village.tracker;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.SystemClock;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class VillageWidget extends AppWidgetProvider {
            static final String REFRESH = "com.village.tracker.REFRESH";
            static final int[] N = {R.id.n1, R.id.n2, R.id.n3, R.id.n4, R.id.n5, R.id.n6};
            static final int[] S = {R.id.s1, R.id.s2, R.id.s3, R.id.s4, R.id.s5, R.id.s6};
            static final int[] T = {R.id.t1, R.id.t2, R.id.t3, R.id.t4, R.id.t5, R.id.t6};
            static final int[] E = {R.id.e1, R.id.e2, R.id.e3, R.id.e4, R.id.e5, R.id.e6};

            static JSONArray load(Context c) {
              try {
                return new JSONArray(c.getSharedPreferences("v", 0).getString("w", "[]"));
              } catch (Exception x) {
                return new JSONArray();
              }
            }

            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              for (int id : ids) m.updateAppWidget(id, build(c));
              schedule(c);
            }

            @Override
            public void onReceive(Context c, Intent i) {
              super.onReceive(c, i);
              if (REFRESH.equals(i.getAction())) {
                AppWidgetManager m = AppWidgetManager.getInstance(c);
                int[] ids = m.getAppWidgetIds(new ComponentName(c, VillageWidget.class));
                onUpdate(c, m, ids);
              }
            }

            static RemoteViews build(Context c) {
              RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
              v.setOnClickPendingIntent(R.id.root,
                PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE));
              JSONArray a = load(c);
              long now = System.currentTimeMillis();
              SimpleDateFormat f = new SimpleDateFormat("EEE h:mm a", Locale.getDefault());
              for (int i = 0; i < 6; i++) {
                String name = "Account " + (i + 1);
                long e = 0;
                JSONObject o = a.optJSONObject(i);
                if (o != null) {
                  name = o.optString("n", name);
                  e = o.optLong("e", 0);
                }
                v.setTextViewText(N[i], name);
                v.setViewVisibility(T[i], View.GONE);
                v.setViewVisibility(E[i], View.VISIBLE);
                if (e <= 0) {
                  v.setTextViewText(E[i], "\u2014");
                  v.setTextColor(E[i], 0xFF8E8E93);
                  v.setTextViewText(S[i], "No timer");
                } else if (e <= now) {
                  v.setTextViewText(E[i], "End");
                  v.setTextColor(E[i], 0xFF30D158);
                  v.setTextViewText(S[i], "Finished " + f.format(new Date(e)));
                } else {
                  v.setViewVisibility(E[i], View.GONE);
                  v.setViewVisibility(T[i], View.VISIBLE);
                  v.setChronometerCountDown(T[i], true);
                  v.setChronometer(T[i], SystemClock.elapsedRealtime() + (e - now), null, true);
                  v.setTextViewText(S[i], "Ends " + f.format(new Date(e)));
                }
              }
              return v;
            }

            static void schedule(Context c) {
              JSONArray a = load(c);
              long now = System.currentTimeMillis();
              long next = 0;
              for (int i = 0; i < a.length(); i++) {
                JSONObject o = a.optJSONObject(i);
                long e = o == null ? 0 : o.optLong("e", 0);
                if (e > now && (next == 0 || e < next)) next = e;
              }
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              PendingIntent p = PendingIntent.getBroadcast(c, 1,
                new Intent(c, VillageWidget.class).setAction(REFRESH),
                PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              if (am == null) return;
              if (next <= 0) {
                am.cancel(p);
                return;
              }
              long at = next + 300;
              try {
                if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, p);
                } else {
                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, p);
                }
              } catch (SecurityException x) {
                am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, p);
              }
            }
          }
          EOF

          cat > app/src/main/java/com/village/tracker/MainActivity.java <<'EOF'
          package com.village.tracker;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView web;

            private class Bridge {
              @JavascriptInterface
              public String get() {
                ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                if (cm == null || !cm.hasPrimaryClip()) return "";
                ClipData d = cm.getPrimaryClip();
                if (d == null || d.getItemCount() == 0) return "";
                CharSequence t = d.getItemAt(0).coerceToText(MainActivity.this);
                return t == null ? "" : t.toString();
              }

              @JavascriptInterface
              public void saveWidget(String json) {
                getSharedPreferences("v", 0).edit().putString("w", json).apply();
                sendBroadcast(new Intent(MainActivity.this, VillageWidget.class).setAction(VillageWidget.REFRESH));
              }
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              web.setBackgroundColor(0xFF000000);
              web.addJavascriptInterface(new Bridge(), "AndroidClip");
              web.setWebViewClient(new WebViewClient());
              web.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VillageTracker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Village Tracker v${{ github.run_number }}
          files: VillageTracker.apk
